version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hireshield-postgres
    restart: always
    environment:
      POSTGRES_USER: hireshield_user
      POSTGRES_PASSWORD: hireshield_password_2026
      POSTGRES_DB: hireshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireshield_user -d hireshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireshield-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://hireshield_user:hireshield_password_2026@db:5432/hireshield_db
      SECRET_KEY: hireshield-docker-secret-key-super-secure-2026
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireshield-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
